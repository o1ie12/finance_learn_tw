# PostgREST config for LOCAL DEVELOPMENT ONLY.
#
# Why this exists: lib/db.ts talks to Supabase through @supabase/supabase-js,
# which speaks PostgREST over HTTP — not raw SQL. So pointing the app at a bare
# Postgres is not possible, and the file store (USE_DEV_STORE) cannot surface
# the things that actually matter here: NOT NULL constraints, column defaults,
# foreign keys. Running PostgREST over the local Postgres gives the app a real
# database behind the exact client it uses in production, without Docker.
#
# The credentials below are throwaway, for a local database seeded with
# fixtures. Nothing here touches or resembles production.
#
# Start with: supabase/local/start-local-api.sh

db-uri = "postgres://qidian_auth:localdev@localhost:5432/qidian_dev"
db-schemas = "public"

# Mirrors Supabase's service role, which bypasses RLS. Every table has RLS
# enabled with no policies, so without a BYPASSRLS role the app would read
# empty tables and write nothing — testing the wrong thing entirely.
db-anon-role = "qidian_api"

# jwt-secret is deliberately unset, so every request runs as db-anon-role.
# Note that PostgREST does NOT simply ignore a bearer token in that state — it
# rejects the request with PGRST300 "Server lacks JWT secret". The Supabase
# client always sends one, so proxy.mjs strips the auth headers before
# forwarding. Do not expose this beyond localhost.

server-host = "127.0.0.1"
server-port = 3002
